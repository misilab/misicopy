name = "misicopy-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret config. The bundle ID is the iPhone app's, used to build the
# APNs `apns-topic` header (`<bundleID>.push-type.liveactivity`).
[vars]
APNS_BUNDLE_ID = "fr.misilab.MisiCopyRemote"
APNS_TEAM_ID = "SM6L2XLUBA"

# Secrets are NOT stored here — set them once with:
#   wrangler secret put APNS_KEY      (paste the full .p8 PEM contents)
#   wrangler secret put APNS_KEY_ID   (the 10-char Key ID)
#
# APNS_TEAM_ID is also overridable as a secret if you prefer to keep it out
# of source control, but the Team ID is not sensitive.
